[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-coach"
version = "0.1.0"
description = "Season-long AI Fantasy Football assistant coach (Yahoo). M1: Auth / OAuth 2.0 + token store."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Hawkins" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "requests-oauthlib>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fantasy-coach = "fantasy_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
